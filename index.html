<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuProfe20 Lab - Planteo de Ecuaciones</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- KaTeX para rendering matemático exacto -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        body { margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100dvh; user-select: none; }
        .font-fun { font-family: 'Nunito', sans-serif; }
        
        @keyframes floatUp { 
            0% { transform: translateY(105vh) rotate(0deg); } 
            100% { transform: translateY(-105vh) rotate(360deg); } 
        }
        @keyframes slideInRight { 
            0% { opacity: 0; transform: translateX(15px); } 
            100% { opacity: 1; transform: translateX(0); } 
        }
        @keyframes confettiExplosion { 
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 
            80% { opacity: 1; } 
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; } 
        }
        @keyframes jellyPop {
            0% { transform: scale3d(.3, .3, .3); opacity: 0; }
            20% { transform: scale3d(1.18, 1.18, 1.18); }
            40% { transform: scale3d(.92, .92, .92); }
            60% { transform: scale3d(1.06, 1.06, 1.06); opacity: 1; }
            80% { transform: scale3d(.97, .97, .97); }
            100% { transform: scale3d(1, 1, 1); opacity: 1; }
        }
        @keyframes robotFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes robotThinkTilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(6deg) translateY(-3px); } }
        @keyframes robotJump { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-15px); } }
        @keyframes robotTalkArmL { 0%, 100% { transform: rotate(45deg); } 50% { transform: rotate(95deg); } }
        @keyframes robotTalkArmR { 0%, 100% { transform: rotate(-45deg); } 50% { transform: rotate(-95deg); } }

        /* Clases para ocultar el scrollbar */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .animate-floatUp { animation: floatUp linear infinite; }
        .animate-slideInRight { animation: slideInRight 0.3s ease-out forwards; }
        .animate-confettiExplosion { animation: confettiExplosion 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .animate-jellyPop { animation: jellyPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-robotFloat { animation: robotFloat 3s ease-in-out infinite; }
        .animate-robotThinkTilt { animation: robotThinkTilt 2s ease-in-out infinite; }
        .animate-robotJump { animation: robotJump 1s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
        .animate-robotTalkArmL { animation: robotTalkArmL 0.6s ease-in-out infinite; }
        .animate-robotTalkArmR { animation: robotTalkArmR 0.6s ease-in-out infinite 0.1s; }

        /* KaTeX Adaptable Styles */
        .katex { font-weight: 900 !important; }
        .katex-display { margin: 0 !important; padding: 0 !important; }
        
        .math-card .katex { font-size: clamp(0.9rem, 1.8vw, 1.25rem) !important; color: #1e293b !important; }
        .math-enunciado .katex { font-size: clamp(0.9rem, 1.8vw, 1.4rem) !important; color: #ffffff !important; }
        .math-current .katex { font-size: clamp(1rem, 2.5vw, 2.2rem) !important; color: #0f172a !important; }
        .math-history .katex { font-size: clamp(0.9rem, 2vw, 1.6rem) !important; color: #475569 !important; }
        .math-robot .katex { font-size: 1.1rem !important; color: inherit !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, memo } = React;

        const Icon = ({ paths, className = "", size = 24, fill = "none", strokeWidth = "2.5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: paths}} />
        );

        const Zap = (p) => <Icon {...p} paths='<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>' />;
        const VolumeX = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>' />;
        const Volume2 = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>' />;
        const Rocket = (p) => <Icon {...p} paths='<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>' />;
        const Sparkles = (p) => <Icon {...p} paths='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 3v4"/><path d="M17 5h4"/>' />;
        const Home = (p) => <Icon {...p} paths='<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' />;
        const ChevronLeft = (p) => <Icon {...p} paths='<polyline points="15 18 9 12 15 6"/>' />;
        const ChevronRight = (p) => <Icon {...p} paths='<polyline points="9 18 15 12 9 6"/>' />;

        const AudioController = {
            ctx: null, muted: false,
            init: function() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.ctx = new AudioContext();
            },
            play: function(type) {
                if (this.muted || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                
                if (type === 'pop') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'pop-reverse') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(650, now); osc.frequency.exponentialRampToValueAtTime(280, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'success') {
                    osc.disconnect();
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                        o.type = 'triangle'; o.frequency.value = freq;
                        o.connect(g); g.connect(this.ctx.destination);
                        const startTime = now + (i * 0.07);
                        g.gain.setValueAtTime(0, startTime); g.gain.linearRampToValueAtTime(0.2, startTime + 0.04); g.gain.linearRampToValueAtTime(0, startTime + 0.35);
                        o.start(startTime); o.stop(startTime + 0.35);
                    });
                } else if (type === 'swoosh') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(280, now); osc.frequency.exponentialRampToValueAtTime(70, now + 0.18);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now); osc.stop(now + 0.18);
                }
            },
            toggleMute: function() { this.muted = !this.muted; return this.muted; }
        };

        const EQUATION_EXERCISES = [
            {
                id: 1,
                title: "Reto 1",
                subtitle: "La Deuda de Maribel",
                cardGradient: "from-amber-500/30 to-orange-600/30 border-amber-400",
                badgeColor: "bg-amber-500",
                enunciadoText: "Maribel tiene una deuda con el banco. Se sabe que el cuádruplo de la cantidad que debe disminuida en S/ 3 000 equivale a su doble aumentado en S/ 9 000. Interpreta los datos y calcula el dinero que adeuda Maribel.",
                enunciadoLatex: String.raw`x = \text{Dinero que adeuda}`,
                steps: [
                    {
                        latex: String.raw`4x - 3000 = 2x + 9000`,
                        propertyText: "Planteando la ecuación",
                        robotSpeech: "¡Hola! Traducimos paso a paso: 'Cuádruplo' es 4x y 'su doble' es 2x. Armamos la igualdad."
                    },
                    {
                        latex: String.raw`4x - 2x = 9000 + 3000`,
                        propertyText: "Agrupando términos",
                        robotSpeech: "Pasamos las variables (x) a la izquierda y los números a la derecha. ¡Cambia el signo!"
                    },
                    {
                        latex: String.raw`2x = 12000`,
                        propertyText: "Reduciendo términos",
                        robotSpeech: "Restamos 4x menos 2x, y sumamos 9000 más 3000. Queda muy sencillo."
                    },
                    {
                        latex: String.raw`x = \frac{12000}{2}`,
                        propertyText: "Despejando x",
                        robotSpeech: "El 2 está multiplicando a la x, así que pasa al otro lado dividiendo."
                    },
                    {
                        latex: String.raw`x = \mathbf{6000}`,
                        propertyText: "¡Misión Cumplida!",
                        robotSpeech: "¡Perfecto! Maribel adeuda S/ 6000. ¡Primer reto superado!"
                    }
                ]
            },
            {
                id: 2,
                title: "Reto 2",
                subtitle: "La Edad de Karla",
                cardGradient: "from-emerald-500/30 to-teal-600/30 border-emerald-400",
                badgeColor: "bg-emerald-500",
                enunciadoText: "La edad de Karla aumentada en su triple y disminuida en 12 es igual a 28. Analiza la situación y calcula cuántos años tiene.",
                enunciadoLatex: String.raw`x = \text{Edad de Karla}`,
                steps: [
                    {
                        latex: String.raw`x + 3x - 12 = 28`,
                        propertyText: "Planteando la ecuación",
                        robotSpeech: "La edad (x) aumentada en su triple (+ 3x) y disminuida en 12 (- 12) es igual a 28."
                    },
                    {
                        latex: String.raw`4x - 12 = 28`,
                        propertyText: "Sumando variables",
                        robotSpeech: "Unimos las 'x'. Una x más tres x nos da un total de cuatro x."
                    },
                    {
                        latex: String.raw`4x = 28 + 12`,
                        propertyText: "Transponiendo términos",
                        robotSpeech: "El número 12 que está restando, salta al otro lado con el signo contrario: sumando."
                    },
                    {
                        latex: String.raw`4x = 40`,
                        propertyText: "Reduciendo",
                        robotSpeech: "28 más 12 es igual a 40. Ya estamos muy cerca del resultado final."
                    },
                    {
                        latex: String.raw`x = \mathbf{10}`,
                        propertyText: "¡Edad descubierta!",
                        robotSpeech: "Dividimos 40 entre 4 y obtenemos 10. ¡Karla tiene 10 años!"
                    }
                ]
            },
            {
                id: 3,
                title: "Reto 3",
                subtitle: "Números Consecutivos",
                cardGradient: "from-pink-500/30 to-rose-600/30 border-pink-400",
                badgeColor: "bg-pink-500",
                enunciadoText: "La suma de tres números consecutivos es 96. Convierte a lenguaje matemático e indica el triple del número intermedio.",
                enunciadoLatex: String.raw`\text{Tres consecutivos: } x, \ x+1, \ x+2`,
                steps: [
                    {
                        latex: String.raw`x + \textcolor{#ef4444}{(}x+1\textcolor{#ef4444}{)} + \textcolor{#ef4444}{(}x+2\textcolor{#ef4444}{)} = 96`,
                        propertyText: "Armando la suma",
                        robotSpeech: "Tres números seguidos se escriben sumando uno cada vez: x, luego x+1 y luego x+2."
                    },
                    {
                        latex: String.raw`3x + 3 = 96`,
                        propertyText: "Reduciendo la ecuación",
                        robotSpeech: "Sumamos todas las variables (3x) y sumamos los números sueltos (1+2 = 3)."
                    },
                    {
                        latex: String.raw`3x = 96 - 3 \implies 3x = 93`,
                        propertyText: "Despejando y restando",
                        robotSpeech: "Pasamos el 3 a restar. Nos queda 93."
                    },
                    {
                        latex: String.raw`x = 31 \quad \text{(Número menor)}`,
                        propertyText: "Hallando el primer número",
                        robotSpeech: "93 entre 3 es 31. Ese es nuestro número base (el menor)."
                    },
                    {
                        latex: String.raw`3 \cdot \textcolor{#ef4444}{(}31 + 1\textcolor{#ef4444}{)} = \mathbf{96}`,
                        propertyText: "¡El triple del intermedio!",
                        robotSpeech: "El intermedio es 32. Nos piden el triple: ¡3 por 32 nos da 96! Brillante."
                    }
                ]
            },
            {
                id: 4,
                title: "Reto 4",
                subtitle: "Compras de Víctor",
                cardGradient: "from-cyan-500/30 to-blue-600/30 border-cyan-400",
                badgeColor: "bg-cyan-500",
                enunciadoText: "Víctor gasta S/ 330 en un pantalón y un par de zapatos. Si se sabe que los zapatos valen el doble del pantalón, analiza y determina cuánto valen los zapatos.",
                enunciadoLatex: String.raw`x = \text{Pantalón}, \quad 2x = \text{Zapatos}`,
                steps: [
                    {
                        latex: String.raw`x + 2x = 330`,

                    {

                        propertyText: "Agrupando las x",
                        robotSpeech: "Una equis del pantalón más dos equis de los zapatos son tres equis en total."
                    },
                    {
                        latex: String.raw`x = \frac{330}{3} \implies x = 110`,
                        propertyText: "Despejando",
                        robotSpeech: "El tres pasa a dividir al total de 330 para saber el valor de 'x'. El pantalón vale 110."
                    },
                    {
                        latex: String.raw`Z = 2\textcolor{#ef4444}{(}110\textcolor{#ef4444}{)}`,
                        propertyText: "Precio de Zapatos",
                        robotSpeech: "Pero atento a la pregunta: nos piden los zapatos, que valen el doble."
                    },
                    {
                        latex: String.raw`Z = \mathbf{220}`,
                        propertyText: "¡Misión Cumplida!",
                        robotSpeech: "2 por 110 nos da S/ 220. ¡Respuesta correcta!"
                    }
                ]
            },
            {
                id: 5,
                title: "Reto 5",
                subtitle: "Campaña de Limpieza",
                cardGradient: "from-purple-500/30 to-violet-600/30 border-purple-400",
                badgeColor: "bg-purple-500",
                enunciadoText: "Luis participa en una campaña de limpieza en la playa. Al terminar, observa que de los 150 kg de basura recolectada, la cantidad de kilos de plástico equivale al cuádruplo de la cantidad del resto de desechos. Representa en lenguaje matemático y determina cuál es el peso del plástico recolectado.",
                enunciadoLatex: String.raw`x = \text{Resto}, \quad 4x = \text{Plástico}`,
                steps: [
                    {
                        latex: String.raw`4x + x = 150`,
                        propertyText: "Planteando total de kilos",

                    },
                    {

                        robotSpeech: "Muy fácil: 4x más 1x nos da 5x. Representan el total de partes."
                    },
                    {

                    },
                    {
                        latex: String.raw`P = 4\textcolor{#ef4444}{(}30\textcolor{#ef4444}{)}`,
                        propertyText: "Peso del Plástico",
                        robotSpeech: "Nos piden el peso del plástico, que es el cuádruplo del resto (4x)."
                    },
                    {
                        latex: String.raw`P = \mathbf{120\text{ kg}}`,
                        propertyText: "¡Calculado!",
                        robotSpeech: "4 veces 30 nos da 120 kg. ¡Súper ecológico!"
                    }
                ]
            },
            {
                id: 6,
                title: "Reto 6",
                subtitle: "Número Excedido",
                cardGradient: "from-blue-500/30 to-indigo-600/30 border-blue-400",
                badgeColor: "bg-blue-500",
                enunciadoText: "Un número excedido en 12 es igual a su triple disminuido en 32. Analiza la situación y calcula el quíntuplo del número.",
                enunciadoLatex: String.raw`x = \text{El número}`,
                steps: [
                    {
                        latex: String.raw`x + 12 = 3x - 32`,

                        robotSpeech: "Excedido significa suma (x + 12). Triple disminuido es resta (3x - 32)."
                    },
                    {
                        latex: String.raw`12 + 32 = 3x - x`,
                        propertyText: "Agrupando convenientemente",
                        robotSpeech: "Juntamos los números a la izquierda y las x a la derecha para que sean positivas."
                    },
                    {
                        latex: String.raw`44 = 2x \implies x = 22`,
                        propertyText: "Hallando el número",
                        robotSpeech: "44 entre 2 es 22. Ya descubrimos de qué número se trata."
                    },
                    {
                        latex: String.raw`5x = 5\textcolor{#ef4444}{(}22\textcolor{#ef4444}{)}`,
                        propertyText: "El quíntuplo",

                    },
                    {
                        latex: String.raw`5x = \mathbf{110}`,
                        propertyText: "¡Victoria!",
                        robotSpeech: "5 por 22 es igual a 110. ¡Reto resuelto!"
                    }
                ]
            },
            {
                id: 7,
                title: "Reto 7 (Nivel 2)",
                subtitle: "El Sueldo de Mario",
                cardGradient: "from-fuchsia-500/30 to-purple-600/30 border-fuchsia-400",
                badgeColor: "bg-fuchsia-500",
                enunciadoText: "Mario recibe su sueldo, paga algunas deudas que tenía y observa que le queda la quinta parte de lo que recibió. Si su deuda era S/ 1 440, interpreta la situación y calcula cuánto dinero le queda.",
                enunciadoLatex: String.raw`x = \text{Sueldo de Mario}`,
                steps: [
                    {
                        latex: String.raw`x - 1440 = \frac{x}{5}`,

            {
                id: 8,

                enunciadoText: "Manuel, Rubí, Carolina y Luis tienen juntos S/ 7 750. Manuel tiene S/ 250 más que Rubí; Carolina, el triple de lo que tiene Rubí, y Luis, el doble de lo que tiene Manuel. Representa la situación en lenguaje matemático y calcula el dinero que tiene Luis.",
                enunciadoLatex: String.raw`R\!:\! x, \ M\!:\!\textcolor{#ef4444}{(}x\!+\!250\textcolor{#ef4444}{)}, \ C\!:\!3x, \ L\!:\!2\textcolor{#ef4444}{(}x\!+\!250\textcolor{#ef4444}{)}`,
                steps: [
                    {
                        latex: String.raw`\textcolor{#ef4444}{(}x + 250\textcolor{#ef4444}{)} + x + 3x + 2\textcolor{#ef4444}{(}x + 250\textcolor{#ef4444}{)} = 7750`,
                        propertyText: "Sumando los 4 montos",
                        robotSpeech: "Usamos 'x' para Rubí. Reemplazamos los valores de Manuel, Carolina y Luis (con paréntesis) igualando al total."

                    {

            {
                id: 9,
                title: "Reto 9 (Nivel 2)",
                subtitle: "Semana de Teatro",
                cardGradient: "from-rose-500/30 to-red-600/30 border-rose-400",
                badgeColor: "bg-rose-500",
                enunciadoText: "Durante cinco días, la venta de entradas en un teatro fue la siguiente: el martes se vendió 35 entradas más que el lunes. Las entradas vendidas el miércoles excedieron en 12 a las del martes, pero fueron 19 menos que las vendidas el jueves, día en que se vendió la mitad de lo vendido el viernes. Realiza las operaciones e indica el número de entradas vendidas el jueves, si en los cinco días se vendieron 2 230 entradas.",
                enunciadoLatex: String.raw`Lu\!:\! x, \ Ma\!:\!x\!+\!35, \ Mi\!:\!x\!+\!47, \ Ju\!:\!x\!+\!66, \ Vi\!:\!2\textcolor{#ef4444}{(}x\!+\!66\textcolor{#ef4444}{)}`,
                steps: [
                    {
                        latex: String.raw`x + x\!+\!35 + x\!+\!47 + x\!+\!66 + 2\textcolor{#ef4444}{(}x\!+\!66\textcolor{#ef4444}{)} = 2230`,
                        propertyText: "La suma de los 5 días",
                        robotSpeech: "Sumamos los datos hilados día tras día, e igualamos al total de 2230 entradas."
                    },
                    {
                        latex: String.raw`4x + 148 + 2x + 132 = 2230`,
                        propertyText: "Despejando",
                        robotSpeech: "Sumamos las 4x sueltas y los números. Resolvemos el paréntesis del viernes multiplicando por 2."
                    },
                    {
                        latex: String.raw`6x + 280 = 2230`,
                        propertyText: "Reducción final",
                        robotSpeech: "Juntamos todo: nos quedan 6x, más 280 (que es 148 + 132)."
                    },
                    {
                        latex: String.raw`6x = 1950 \implies x = 325`,
                        propertyText: "Ventas del Lunes",
                        robotSpeech: "Restamos 2230 - 280 para obtener 1950. Al dividir entre 6, hallamos que el lunes (x) se vendieron 325."
                    },
                    {
                        latex: String.raw`Ju = 325 + 66 = \mathbf{391}`,
                        propertyText: "Ventas del Jueves",
                        robotSpeech: "Nos piden el Jueves, que era (x + 66). Reemplazamos: ¡325 + 66 son 391 entradas!"
                    }
                ]
            },
            {
                id: 10,
                title: "Reto 10 (Excelencia)",
                subtitle: "El Tesoro de Germán",
                cardGradient: "from-amber-400/30 to-yellow-600/30 border-yellow-400",
                badgeColor: "bg-yellow-500",
                enunciadoText: "Germán ha juntado S/ 500 en billetes de S/ 20 y S/ 10. Si en total tiene 35 billetes, interpreta la información y calcula el número de billetes de menor denominación.",
                enunciadoLatex: String.raw`x = \text{Billetes de } S/20, \quad y = \text{Billetes de } S/10`,
                steps: [
                    {
                        latex: String.raw`x + y = 35 \quad \text{y} \quad 20x + 10y = 500`,
                        propertyText: "Sistema de ecuaciones",
                        robotSpeech: "Planteamos 2 ecuaciones: la suma de billetes da 35. Y la suma del valor del dinero da 500."
                    },
                    {
                        latex: String.raw`y = 35 - x`,
                        propertyText: "Despejando",
                        robotSpeech: "De la primera ecuación, despejamos 'y' pasándola a términos de 'x'. Así podremos reemplazar."
                    },
                    {
                        latex: String.raw`20x + 10\textcolor{#ef4444}{(}35 - x\textcolor{#ef4444}{)} = 500`,
                        propertyText: "Sustitución",
                        robotSpeech: "Reemplazamos 'y' en la segunda ecuación utilizando paréntesis. ¡Ahora solo hay una incógnita!"
                    },
                    {
                        latex: String.raw`20x + 350 - 10x = 500 \implies 10x = 150`,
                        propertyText: "Resolviendo para x",
                        robotSpeech: "Multiplicamos el 10, agrupamos las x, y pasamos 350 a restar. Descubrimos que hay 15 billetes de 20."
                    },
                    {
                        latex: String.raw`y = 35 - 15 = \mathbf{20}`,
                        propertyText: "Los billetes menores",
                        robotSpeech: "Nos piden los billetes de menor denominación (los de 10). Reemplazamos 'x': ¡Germán tiene 20 billetes de S/ 10!"
                    }
                ]
            }
        ];

        const MathDisplay = memo(({ latex, className = "" }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try {
                        window.katex.render(latex, containerRef.current, {
                            displayMode: true, throwOnError: false, strict: false, trust: true
                        });
                    } catch (e) {
                        containerRef.current.innerText = latex;
                    }
                }
            }, [latex]);

            return (
                <div className={`relative w-full flex justify-center ${className}`}>
                    <div ref={containerRef} className="w-full text-center" />
                </div>
            );
        });

        const FloatingBackground = memo(() => {
            const symbols = ['+', '-', '×', '÷', '=', 'x', 'y', 'z', 'α', 'β', '∑', '∞', '√'];
            const elements = Array.from({ length: 30 }).map((_, i) => ({
                id: i, symbol: symbols[Math.floor(Math.random() * symbols.length)], left: `${Math.random() * 100}%`,
                animationDuration: `${10 + Math.random() * 15}s`, animationDelay: `-${Math.random() * 20}s`,
                fontSize: `${1 + Math.random() * 3}rem`, opacity: 0.1 + Math.random() * 0.15
            }));
            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                    {elements.map((el) => (
                        <div key={el.id} className="absolute text-white font-black animate-floatUp select-none drop-shadow-lg" style={{ left: el.left, bottom: '-15%', fontSize: el.fontSize, opacity: el.opacity, animationDuration: el.animationDuration, animationDelay: el.animationDelay }}>
                            {el.symbol}
                        </div>
                    ))}
                </div>
            );
        });

        const Confetti = memo(() => {
            const colors = ['#fde047', '#60a5fa', '#f472b6', '#34d399', '#a78bfa', '#ff5722'];
            const pieces = Array.from({ length: 120 }).map((_, i) => ({
                id: i, left: `${50 + (Math.random() * 20 - 10)}%`, color: colors[Math.floor(Math.random() * colors.length)],
                tx: `${(Math.random() - 0.5) * 800}px`, ty: `${(Math.random() - 1) * 800}px`, rot: `${Math.random() * 720}deg`, delay: `${Math.random() * 0.2}s`
            }));
            return (
                <div className="absolute inset-0 pointer-events-none z-50 flex items-center justify-center overflow-hidden">
                    {pieces.map((p) => (
                        <div key={p.id} className="absolute w-4 h-4 sm:w-5 sm:h-5 rounded-full animate-confettiExplosion shadow-sm" style={{ backgroundColor: p.color, '--tx': p.tx, '--ty': p.ty, '--rot': p.rot, animationDelay: p.delay, left: p.left, top: '50%' }} />
                    ))}
                </div>
            );
        });

        const RobotAssistant = ({ step, maxSteps }) => {
            const isFinalStep = step >= maxSteps;
            const isThinking = step === maxSteps - 1;

            const getContainerAnim = () => { if (isFinalStep) return 'animate-robotJump'; if (isThinking) return 'animate-robotThinkTilt'; return 'animate-robotFloat'; };
            const getArmLAnim = () => { if (isFinalStep) return 'rotate-[150deg] animate-pulse'; if (step > 0) return 'animate-robotTalkArmL'; return 'rotate-45'; };
            const getArmRAnim = () => { if (isFinalStep) return '-rotate-[150deg] animate-pulse'; if (step > 0) return 'animate-robotTalkArmR'; return '-rotate-45'; };
            
            const getEyes = () => {
                if (isFinalStep) return <div className="w-full flex justify-between px-1.5"><div className="w-3.5 h-2 bg-emerald-400 rounded-t-full mt-1"></div><div className="w-3.5 h-2 bg-emerald-400 rounded-t-full mt-1"></div></div>;
                if (step === 0) return <div className="w-full flex justify-between px-2"><div className="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-pulse"></div><div className="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-pulse"></div></div>;
                return <div className="w-full flex justify-between px-1.5"><div className="w-3 h-3 bg-yellow-400 rounded-full animate-bounce"></div><div className="w-3 h-3 bg-yellow-400 rounded-full animate-bounce"></div></div>;
            };
            const getMouth = () => {
                if (isFinalStep) return <div className="w-6 h-3.5 bg-rose-400 rounded-b-full mt-1.5"></div>;
                if (step === 0) return <div className="w-4 h-1.5 bg-cyan-300 rounded-full mt-2"></div>;
                return <div className="w-3.5 h-3.5 bg-rose-400 rounded-full mt-1 animate-ping"></div>;
            };

            return (
                <div className={`relative flex flex-col items-center drop-shadow-lg select-none ${getContainerAnim()}`}>
                    <div className="relative z-0 flex flex-col items-center translate-y-1">
                        <div className={`w-3.5 h-3.5 rounded-full shadow-[0_0_10px_currentColor] z-10 transition-colors duration-300 ${isFinalStep ? 'text-emerald-400 bg-emerald-400' : 'text-yellow-400 bg-yellow-400 animate-pulse'}`}></div>
                        <div className="w-1.5 h-4 bg-slate-300"></div>
                    </div>
                    <div className="relative z-10 w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-white to-slate-200 rounded-[1.2rem] border-[3px] border-indigo-400 shadow-xl flex flex-col items-center justify-center p-1.5">
                        <div className="w-full h-full bg-slate-900 rounded-lg flex flex-col items-center justify-center p-1.5 shadow-inner border-2 border-indigo-500">
                            {getEyes()} {getMouth()}
                        </div>
                    </div>
                    <div className={`absolute top-1/2 -left-2 w-3 h-5 bg-slate-200 border-[2.5px] border-indigo-400 rounded-full z-0 origin-top ${getArmLAnim()}`}></div>
                    <div className={`absolute top-1/2 -right-2 w-3 h-5 bg-slate-200 border-[2.5px] border-indigo-400 rounded-full z-0 origin-top ${getArmRAnim()}`}></div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('home'); // 'home' | 'lab'
            const [exIdx, setExIdx] = useState(0);
            const [step, setStep] = useState(0);
            const [isMuted, setIsMuted] = useState(false);
            const scrollContainerRef = useRef(null);

            const currentExercise = EQUATION_EXERCISES[exIdx];
            const maxSteps = currentExercise.steps.length - 1;
            const currentStepData = currentExercise.steps[step];

            const handleInteraction = () => AudioController.init();

            // Auto-scroll al añadir un nuevo paso
            useEffect(() => {
                if(scrollContainerRef.current) {
                    scrollContainerRef.current.scrollTop = scrollContainerRef.current.scrollHeight;
                }
            }, [step, exIdx, view]);

            const startExercise = (index) => {
                handleInteraction();
                AudioController.play('swoosh');
                setExIdx(index);
                setStep(0);
                setView('lab');
            };

            const nextStep = () => {
                handleInteraction();
                if (step < maxSteps) {
                    const next = step + 1;
                    setStep(next);
                    if (next === maxSteps) AudioController.play('success');
                    else AudioController.play('pop');
                } else {
                    if (exIdx < EQUATION_EXERCISES.length - 1) {
                        AudioController.play('swoosh');
                        setExIdx(exIdx + 1);
                        setStep(0);
                    } else {
                        AudioController.play('swoosh');
                        setView('home');
                    }
                }
            };

            const prevStep = () => {
                handleInteraction();
                if (step > 0) {
                    setStep(step - 1);
                    AudioController.play('pop-reverse');
                }
            };

            const toggleMute = () => { handleInteraction(); setIsMuted(AudioController.toggleMute()); };

            if (view === 'home') {
                return (
                    <div className="w-screen min-h-[100dvh] bg-gradient-to-br from-[#4f46e5] via-[#7c3aed] to-[#db2777] flex flex-col items-center justify-start p-4 sm:p-6 relative font-fun overflow-y-auto overflow-x-hidden scrollbar-hide">
                        <FloatingBackground />
                        
                        <div className="w-[96%] max-w-[1400px] z-20 flex items-center justify-between mb-8 sm:mb-12 mt-2">
                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-2xl border-2 border-yellow-300 bg-white/15 backdrop-blur-md text-yellow-300 font-black tracking-wider uppercase shadow-md text-sm sm:text-base">
                                <Rocket className="w-5 h-5 text-yellow-300" /> TuProfe20 Lab
                            </div>
                            <button onClick={toggleMute} className="p-2 sm:p-3 rounded-2xl bg-white/20 border-2 border-white/30 backdrop-blur-md text-white hover:bg-white/30 transition-all active:scale-95">
                                {isMuted ? <VolumeX className="w-5 h-5 sm:w-6 sm:h-6" /> : <Volume2 className="w-5 h-5 sm:w-6 sm:h-6" />}
                            </button>
                        </div>

                        <div className="relative z-10 text-center w-[96%] max-w-[1400px] flex flex-col items-center">
                            <h1 className="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-black text-white mb-3 sm:mb-5 drop-shadow-[0_6px_0_rgba(0,0,0,0.3)] tracking-tight leading-none uppercase">
                                Planteo de <span className="text-yellow-300 underline decoration-wavy decoration-pink-400">Ecuaciones</span>
                            </h1>
                            <p className="text-base sm:text-xl lg:text-2xl text-purple-100 mb-8 sm:mb-12 font-bold max-w-3xl leading-relaxed">
                                ¡Traduce el problema, agrupa los términos y descubre la incógnita paso a paso! 🚀🧠
                            </p>

                            <div className="w-full flex flex-wrap justify-center items-stretch gap-4 sm:gap-6 mb-12">
                                {EQUATION_EXERCISES.map((ex, idx) => (
                                    <button
                                        key={ex.id}
                                        onClick={() => startExercise(idx)}
                                        className="w-[calc(50%-0.5rem)] md:w-[calc(33.333%-1rem)] lg:w-[calc(30%-1rem)] group text-left p-3 sm:p-5 rounded-[1.5rem] bg-gradient-to-br bg-opacity-90 backdrop-blur-xl border-[3px] border-white/40 hover:-translate-y-2 hover:shadow-[0_15px_30px_rgba(0,0,0,0.3)] transition-all flex flex-col relative overflow-hidden shadow-lg min-h-[9rem] sm:min-h-[11rem]"
                                        style={{ backgroundImage: `linear-gradient(to bottom right, var(--tw-gradient-stops))` }}
                                    >
                                        <div className={`absolute inset-0 opacity-80 ${ex.cardGradient}`}></div>
                                        <div className="relative z-10 flex-1 flex flex-col">
                                            <div className="flex items-center justify-between mb-2">
                                                <span className={`${ex.badgeColor} text-white text-[10px] sm:text-xs font-black px-2 py-1 rounded-md uppercase tracking-widest shadow-sm`}>
                                                    Reto {ex.id}
                                                </span>
                                                <span className="bg-black/20 text-white text-[10px] sm:text-xs font-bold px-2 py-1 rounded-md">
                                                    {ex.steps.length} pasos
                                                </span>
                                            </div>
                                            <div className="flex-1 my-2 bg-white/95 rounded-xl p-2 sm:p-3 text-slate-900 shadow-inner overflow-hidden flex items-center justify-center border border-white/60 w-full pointer-events-none math-card">
                                                <MathDisplay latex={ex.steps[0].latex} />
                                            </div>
                                            <div className="text-white text-xs sm:text-sm font-black flex items-center justify-between mt-1">
                                                <span className="truncate pr-2 drop-shadow-md">{ex.subtitle}</span>
                                                <span className="bg-yellow-400 text-slate-900 w-6 h-6 rounded-full flex items-center justify-center font-black group-hover:translate-x-1 transition-transform shrink-0 shadow-sm">
                                                    ➔
                                                </span>
                                            </div>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#1e1b4b] via-[#4c1d95] to-[#db2777] text-slate-800 flex flex-col p-2 sm:p-4 relative font-fun overflow-hidden">
                    <FloatingBackground />
                    {step === maxSteps && <Confetti />}

                    {/* Navbar InGame */}
                    <div className="shrink-0 relative z-10 w-[96%] max-w-[1400px] mx-auto flex justify-between items-center mb-3 sm:mb-4 px-1">
                        <button onClick={() => { AudioController.play('swoosh'); setView('home'); }} className="flex items-center justify-center px-4 py-2 sm:px-5 sm:py-2.5 rounded-[1rem] sm:rounded-[1.2rem] bg-white/10 border-[3px] border-white/30 backdrop-blur-md text-white font-black hover:bg-white/20 transition-all shadow-lg active:scale-95 text-sm sm:text-base hover:scale-105">
                            <Home className="w-5 h-5 sm:mr-2" />
                            <span className="hidden sm:inline">Portada</span>
                        </button>

                        <div className="flex items-center gap-1.5 sm:gap-2 bg-black/30 p-1.5 sm:p-2 rounded-[1rem] sm:rounded-[1.2rem] border-2 border-white/20 backdrop-blur-md shadow-lg overflow-x-auto scrollbar-hide max-w-[50vw]">
                            {EQUATION_EXERCISES.map((ex, i) => (
                                <button
                                    key={ex.id}
                                    onClick={() => startExercise(i)}
                                    className={`shrink-0 w-8 h-8 sm:w-11 sm:h-11 rounded-[0.8rem] sm:rounded-[1rem] font-black text-sm sm:text-base transition-all ${exIdx === i ? 'bg-yellow-400 text-slate-900 scale-110 shadow-[0_0_15px_rgba(250,204,21,0.6)]' : 'text-white hover:bg-white/20'}`}
                                >
                                    {ex.id}
                                </button>
                            ))}
                        </div>

                        <button onClick={toggleMute} className="p-2 sm:p-3 rounded-[1rem] sm:rounded-[1.2rem] bg-white/10 border-[3px] border-white/30 text-white hover:bg-white/20 transition-all shadow-lg active:scale-95 hover:scale-105">
                            {isMuted ? <VolumeX className="w-5 h-5 sm:w-6 sm:h-6" /> : <Volume2 className="w-5 h-5 sm:w-6 sm:h-6" />}
                        </button>
                    </div>

                    <div className="flex-1 min-h-0 relative z-10 w-[96%] max-w-[1400px] mx-auto bg-white rounded-[2rem] sm:rounded-[2.5rem] border-[6px] sm:border-[8px] border-slate-100 shadow-[0_30px_60px_rgba(0,0,0,0.5)] flex flex-col overflow-hidden">
                        
                        {/* Enunciado Area */}
                        <div className="shrink-0 bg-slate-900 border-b-[6px] border-indigo-500 px-4 py-4 sm:px-8 sm:py-6 flex flex-col items-center justify-center relative shadow-md z-20">
                            <div className="flex items-center gap-3 mb-3 sm:mb-4">
                                <span className="bg-yellow-400 text-slate-900 font-black text-xs sm:text-sm px-3 sm:px-4 py-1 rounded-md uppercase tracking-widest shadow-sm">
                                    {currentExercise.title}
                                </span>
                                <span className="text-purple-200 font-bold text-xs sm:text-base bg-white/10 px-3 py-1 rounded-md">
                                    {currentExercise.subtitle}
                                </span>
                            </div>
                            <div className="flex flex-col items-center justify-center gap-3 sm:gap-4 text-white font-black text-base sm:text-lg md:text-xl text-center w-full max-w-5xl mx-auto">
                                <span className="w-full leading-relaxed">{currentExercise.enunciadoText}</span>
                                <div className="math-enunciado inline-block bg-black/40 px-6 py-2.5 rounded-xl border border-white/20 max-w-full overflow-x-auto scrollbar-hide mt-1 sm:mt-2">
                                    <MathDisplay latex={currentExercise.enunciadoLatex} />
                                </div>
                            </div>
                        </div>

                        {/* Desarrollo Contínuo (Múltiples Pasos) */}
                        <div className="flex-1 flex flex-col items-center p-4 sm:p-6 relative bg-slate-50 overflow-hidden w-full">
                            <div className="absolute inset-0 opacity-5 bg-[radial-gradient(#475569_2px,transparent_2px)] [background-size:30px_30px] pointer-events-none"></div>

                            {/* Badge actual arriba flotando */}
                            <div key={`badge-${exIdx}-${step}`} className="z-20 mb-4 animate-jellyPop text-center shrink-0">
                                <span className={`inline-flex items-center gap-2 sm:gap-3 px-5 py-2 sm:px-6 sm:py-2.5 rounded-[1rem] font-black text-sm sm:text-lg lg:text-xl shadow-lg border-2 ${step === maxSteps ? 'bg-amber-400 text-slate-900 border-yellow-200' : 'bg-gradient-to-r from-pink-600 to-purple-600 text-white border-pink-400'}`}>
                                    <Sparkles className="w-5 h-5 sm:w-6 sm:h-6" /> 
                                    <span>{currentStepData.propertyText}</span>
                                </span>
                            </div>

                            {/* Contenedor escrolleable con los pasos históricos */}
                            <div ref={scrollContainerRef} className="w-full flex-1 flex flex-col items-center justify-start z-10 px-2 space-y-3 sm:space-y-4 overflow-y-auto scrollbar-hide pb-4">
                                {currentExercise.steps.slice(0, step + 1).map((s, idx) => (
                                    <div key={`${exIdx}-${idx}`} className={`transition-all duration-300 px-4 py-3 sm:px-8 sm:py-4 w-fit max-w-full text-center rounded-[1.5rem] sm:rounded-[2rem] flex items-center justify-center min-h-[4rem] sm:min-h-[5rem] overflow-x-auto scrollbar-hide ${
                                        idx === step 
                                        ? (step === maxSteps ? 'bg-[#fde047] border-[4px] sm:border-[6px] border-[#eab308] shadow-[0_15px_30px_rgba(234,179,8,0.5)] animate-jellyPop math-current' : 'bg-white border-[4px] sm:border-[6px] border-pink-400 shadow-[0_10px_25px_rgba(236,72,153,0.3)] animate-jellyPop math-current') 
                                        : 'bg-white/70 border-[2px] sm:border-[3px] border-slate-200 opacity-80 math-history scale-95'
                                    }`}>
                                        <MathDisplay latex={s.latex} />
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Zona Inferior: Robot y Feedback */}
                        <div className="shrink-0 bg-white w-full px-4 py-3 sm:px-8 sm:py-5 flex items-center gap-4 sm:gap-6 border-t-[6px] border-slate-100 z-20 relative shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                            <div className="shrink-0 absolute -top-12 sm:relative sm:-top-0 left-4 sm:left-0 drop-shadow-xl">
                                <RobotAssistant step={step} maxSteps={maxSteps} />
                            </div>
                            <div className="flex-1 text-base sm:text-xl md:text-2xl font-bold text-slate-700 leading-snug sm:leading-relaxed bg-indigo-50/80 p-4 sm:p-5 rounded-[1.2rem] sm:rounded-[1.5rem] border-2 border-indigo-100 min-h-[5rem] flex items-center shadow-sm ml-[4.5rem] sm:ml-0">
                                <div key={`speech-${exIdx}-${step}`} className="animate-slideInRight w-full">
                                    {currentStepData.robotSpeech}
                                </div>
                            </div>
                        </div>

                        {/* Controles Nav */}
                        <div className="shrink-0 bg-gradient-to-b from-[#eadef7] to-[#d6c1f0] p-3 sm:p-5 w-full flex flex-col items-center border-t-[6px] border-white z-20">
                            <div className="flex justify-center items-stretch w-full max-w-4xl gap-3 sm:gap-4 h-14 sm:h-16">
                                <button
                                    onClick={prevStep}
                                    disabled={step === 0}
                                    className="flex-[0.8] bg-[#d8b4fe] border-b-[6px] border-[#a855f7] text-[#581c87] rounded-l-2xl rounded-r-xl font-black text-base sm:text-xl flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[6px] disabled:opacity-40 transition-all hover:bg-[#e9d5ff]"
                                >
                                    <ChevronLeft className="w-6 h-6 sm:w-8 sm:h-8 stroke-[4px]" />
                                    <span className="hidden sm:inline">Atrás</span>
                                </button>

                                <div className="bg-[#a855f7] text-white font-black px-4 sm:px-6 text-lg sm:text-2xl flex items-center justify-center rounded-2xl border-b-[6px] border-[#7e22ce] shadow-inner whitespace-nowrap min-w-[5rem]">
                                    Paso {step + 1}/{maxSteps + 1}
                                </div>

                                <button
                                    onClick={nextStep}
                                    className={`flex-[2] border-b-[6px] text-white rounded-r-2xl rounded-l-xl font-black text-lg sm:text-2xl md:text-3xl flex items-center justify-center gap-2 active:border-b-0 active:translate-y-[6px] transition-all shadow-sm hover:brightness-110 ${
                                        step === maxSteps
                                            ? 'bg-gradient-to-r from-[#10b981] to-[#047857] border-[#065f46] animate-pulse'
                                            : 'bg-gradient-to-r from-[#f59e0b] to-[#f97316] border-[#c2410c]'
                                    }`}
                                >
                                    <span>
                                        {step < maxSteps
                                            ? '¡Siguiente Paso!'
                                            : exIdx < EQUATION_EXERCISES.length - 1
                                            ? `Ir al Reto ${exIdx + 2}`
                                            : '¡Volver a la Portada!'}
                                    </span>
                                    <ChevronRight className="w-6 h-6 sm:w-8 sm:h-8 stroke-[4px]" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
